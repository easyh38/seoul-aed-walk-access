# 개발 환경. aed-db-data 볼륨은 기존 DB를 그대로 재사용한다 (external).
#   처음이면: docker volume create aed-db-data
#   단독 실행하던 aed-db / valhalla 컨테이너가 있으면 먼저 멈춘다
#   (같은 포트를 쓰고, 같은 DB 볼륨을 두 컨테이너가 동시에 열면 안 된다):
#   docker stop aed-db valhalla
name: seoul-aed-walk-access

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER가 .env에 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB가 .env에 필요합니다}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aed-db-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(처음 생성 시)만 실행된다. 기존 데이터에는 영향 없음
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valhalla:
    # 타일을 빌드한 이미지 그대로 고정 (Valhalla 3.9.2-b95151088, 2026-11-16 빌드).
    # latest는 새 버전이 나오면 바뀌어 타일·경로 결과가 달라질 수 있다
    image: ghcr.io/valhalla/valhalla-scripted@sha256:7a1c2e6c86122af34c315430c646fe5790f9dc3275c47ad586453411a12ee6a2
    restart: unless-stopped
    command: ["build_tiles"]
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      # README·.gitignore와 같은 위치 (pbf와 빌드된 타일이 여기에 있다)
      - ./valhalla/custom_files:/custom_files
    environment:
      server_threads: "1"
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
      serve_tiles: "True"
      update_existing_config: "True"
      force_rebuild: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL이 .env에 필요합니다}
      DB_HOST: db
      DB_PORT: "5432"
      VALHALLA_BASE_URL: http://valhalla:8002
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started

  nginx:
    image: nginx:1.31.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started

volumes:
  aed-db-data:
    external: true
    name: aed-db-data
