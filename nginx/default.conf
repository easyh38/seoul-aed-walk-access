# 접속 기록에는 주소의 ? 뒤(쿼리)와 IP를 남기지 않는다.
# /api/nearest?lat=..&lon=.. 의 클릭 좌표가 로그에 쌓이지 않게 하기 위해서다 (PRD 8-6).
log_format privacy '[$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

# 오류 기록도 같은 이유로 줄인다. 기본(error) 수준에서는 502/504 때
# "client: <IP>, request: GET /api/nearest?lat=..&lon=.." 한 줄이 남는다.
error_log /var/log/nginx/error.log crit;

# 요청 수 제한 (IP별). 제보 도배와, 요청마다 Valhalla를 부르는 찾기의 과부하를 막는다.
limit_req_zone $binary_remote_addr zone=nearest:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=reports:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # 받는 본문은 오류 제보 JSON(설명 500자)뿐이다
    client_max_body_size 16k;
    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # 기본 보안 헤더 (location에서 add_header를 쓰면 여기 값이 상속되지 않으므로 아래에서 다시 넣는다)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 화면 파일과 API 응답 압축 (도달 구역 GeoJSON은 1MB를 넘는다)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # Nginx 자체 상태 확인
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 찾기·제보는 요청 수를 제한한 뒤 FastAPI로 넘긴다 (설정은 아래 API 프록시와 같다)
    location = /api/nearest {
        limit_req zone=nearest burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location = /api/reports {
        limit_req zone=reports burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # FastAPI API 및 문서 프록시
    # /docs, /docs/... 만 넘긴다 (/docsxxx 같은 경로는 아래 화면 파일 처리로)
    location ~ ^/(api/|(docs|redoc)(/|$)|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 화면 파일 (web/ → /usr/share/nginx/html, docker-compose.yml에서 마운트)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 화면 코드는 배포 때마다 바뀌므로 매번 새로 확인하고, 라이브러리·데이터는 하루 캐시
    location ~* \.(?:html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ^~ /vendor/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
