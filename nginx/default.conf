# 접속 기록에는 주소의 ? 뒤(쿼리)와 IP를 남기지 않는다.
# /api/nearest?lat=..&lon=.. 의 클릭 좌표가 로그에 쌓이지 않게 하기 위해서다 (PRD 8-6).
log_format privacy '[$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    access_log /var/log/nginx/access.log privacy;

    # 화면 파일과 API 응답 압축 (도달 구역 GeoJSON은 1MB를 넘는다)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # Nginx 자체 상태 확인
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # FastAPI API 및 문서 프록시
    # /docs, /docs/... 만 넘긴다 (/docsxxx 같은 경로는 아래 화면 파일 처리로)
    location ~ ^/(api/|(docs|redoc)(/|$)|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 화면 파일 (web/ → /usr/share/nginx/html, docker-compose.yml에서 마운트)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 화면 코드는 배포 때마다 바뀌므로 매번 새로 확인하고, 라이브러리·데이터는 하루 캐시
    location ~* \.(?:html|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location ^~ /vendor/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }
}
